stages:
  - build

build-trayapp:
  stage: build
  script:
    - echo "Building TrayApp..."
    - mkdir -p build
    - cd build
    - cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
    - cmake --build . --config Release
    - ls -la bin/Release/
  artifacts:
    paths:
      - build/bin/Release/TrayService.exe
      - build/bin/Release/TrayApp.exe
    expire_in: 30 days