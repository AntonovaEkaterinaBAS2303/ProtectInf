stages:
  - build
  - test

variables:
  BUILD_DIR: out/build/x64-release
  SOLUTION: WindowsServiceApp

# ============================================
# Build job for Windows x64
# ============================================
build-windows:
  stage: build
  tags:
    - windows
    - visual-studio-2022
  script:
    - echo "=== Building TrayApp Windows Service ==="
    - mkdir -p out/build/x64-release
    - cmake -B ${BUILD_DIR} -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
    - cmake --build ${BUILD_DIR} --config Release
    - echo "=== Build complete ==="
    - dir ${BUILD_DIR}\bin\Release\
  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${BUILD_DIR}/bin/Release/TrayService.exe
      - ${BUILD_DIR}/bin/Release/TrayApp.exe
      - ${BUILD_DIR}/bin/Release/*.dll
    expire_in: 30 days
  only:
    - main
    - master
    - merge_requests

# ============================================
# Build job for Windows x64 Debug
# ============================================
build-windows-debug:
  stage: build
  tags:
    - windows
    - visual-studio-2022
  script:
    - echo "=== Building Debug ==="
    - mkdir -p out/build/x64-debug
    - cmake -B out/build/x64-debug -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug
    - cmake --build out/build/x64-debug --config Debug
  artifacts:
    name: "${CI_PROJECT_NAME}-debug-${CI_COMMIT_REF_SLUG}"
    paths:
      - out/build/x64-debug/bin/Debug/TrayService.exe
      - out/build/x64-debug/bin/Debug/TrayApp.exe
      - out/build/x64-debug/bin/Debug/*.pdb
    expire_in: 7 days
  only:
    - develop
    - merge_requests

# ============================================
# Smoke test
# ============================================
smoke-test:
  stage: test
  tags:
    - windows
  script:
    - echo "=== Smoke Test ==="
    - ${BUILD_DIR}\bin\Release\TrayApp.exe --help 2>&1 || echo "App exists"
    - echo "TrayService.exe size:" && dir ${BUILD_DIR}\bin\Release\TrayService.exe
    - echo "TrayApp.exe size:" && dir ${BUILD_DIR}\bin\Release\TrayApp.exe
  needs:
    - build-windows
  only:
    - main
    - master