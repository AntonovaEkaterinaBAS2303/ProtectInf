name: Build TrayApp Windows Service

on:
  push:
    branches: [main, master, feature/windows-service-rpc]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Generate RPC stubs
      run: |
        mkdir generated
        midl /out generated /h generated\service_rpc.h /cstub generated\rpc_c.c /sstub generated\rpc_s.c src\common\rpc_interface.idl
      working-directory: ${{ github.workspace }}
    
    - name: Copy RPC files to common
      run: |
        copy generated\service_rpc.h src\common\service_rpc.h /Y
        copy generated\rpc_c.c src\common\rpc_c.c /Y
        copy generated\rpc_s.c src\common\rpc_s.c /Y
    
    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
    
    - name: Build project
      run: cmake --build build --config Release --parallel
    
    - name: List artifacts
      run: dir build\bin\Release\*.exe
    
    - name: Upload TrayService.exe
      uses: actions/upload-artifact@v4
      with:
        name: TrayService-${{ github.sha }}
        path: build/bin/Release/TrayService.exe
    
    - name: Upload TrayApp.exe
      uses: actions/upload-artifact@v4
      with:
        name: TrayApp-${{ github.sha }}
        path: build/bin/Release/TrayApp.exe
    
    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TrayApp-full-${{ github.sha }}
        path: build/bin/Release/